[tools]
python = "3.12"  # runs the server and the tests
uv = "0.10.2"    # creates the venv and installs the package + dev deps

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the package (editable) and dev deps into the local venv"
run = "uv pip install -e '.[dev]'"

[tasks.test]
description = "Run the test suite"
run = "python -m pytest tests -q"

[tasks.lint]
description = "Lint and check formatting (ruff)"
run = ["ruff check .", "ruff format --check ."]

[tasks.typecheck]
description = "Type-check (basedpyright, zero warnings)"
run = "basedpyright --warnings"

[tasks.serve]
description = "Run the server with the config named in MEMEX_CONFIG"
run = "memex-mcp"
