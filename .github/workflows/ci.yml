name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The floor from requires-python, and the newest release (which also
        # warns about unclosed SQLite connections).
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the pinned dev tools
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (basedpyright, zero warnings)
        run: basedpyright --warnings
      - name: Cognitive complexity (at most 15 per function)
        run: python scripts/cognitive_complexity.py
      - name: Tests
        run: python -m pytest tests -q

  markdown-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Check markdown formatting
        run: deno fmt --check

  image:
    # Builds the image on every pull request so the publish on main is never
    # the first build; image.yml pushes it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: memex-mcp:ci
      - name: Smoke the image
        run: |
          docker run --rm --entrypoint python memex-mcp:ci -c "
          import sqlite3, sqlite_vec
          conn = sqlite3.connect(':memory:')
          conn.enable_load_extension(True)
          sqlite_vec.load(conn)
          conn.execute('CREATE VIRTUAL TABLE t USING fts5(x)')
          print(conn.execute('SELECT vec_version()').fetchone()[0])
          import memex_mcp.server
          "
          docker run --rm --entrypoint git memex-mcp:ci --version
