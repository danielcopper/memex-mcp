name: Release

on:
  push:
    branches: [main]

# No workflow-level permissions: each job asks for exactly what it needs.
permissions: {}

# Serialize releases: two quick pushes to main must not run release-please
# concurrently and race on the release PR / tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every write goes through the App token below; the job's GITHUB_TOKEN is
    # never used, so it gets no permissions.
    permissions: {}
    steps:
      # Mint a GitHub App installation token so release-please's PR, branch
      # and tag are created by the App, not GITHUB_TOKEN. Events caused by
      # GITHUB_TOKEN start no workflows (anti-recursion): the release PR's
      # required status checks would stay "Expected" and unmergeable, and the
      # v* tag would not start image.yml, which publishes the versioned image.
      # Scoped to exactly what release-please needs.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
