[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memex-mcp"
version = "0.1.1"
description = "MCP server for a shared, per-person Markdown memory in git: search and read with rights from your identity provider"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# An application, not a library: every package the code imports is pinned
# exactly, so the image, CI and a local `mise run setup` run the same releases.
dependencies = [
    "anyio==4.15.1",
    "fastmcp==4.0.11",
    "httpx2==2.13.1",
    "pydantic==2.13.5",
    "pyjwt[crypto]==2.15.1",
    "sqlite-vec==0.1.9",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["basedpyright==1.40.2", "pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
memex-mcp = "memex_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["memex_mcp*"]

[tool.setuptools.package-data]
memex_mcp = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "ASYNC",   # flake8-async
    "S",       # flake8-bandit (security)
    "BLE",     # flake8-blind-except
    "B",       # flake8-bugbear
    "A",       # flake8-builtins
    "C4",      # flake8-comprehensions
    "C90",     # mccabe
    "DTZ",     # flake8-datetimez
    "T20",     # flake8-print
    "PIE",     # flake8-pie
    "RSE",     # flake8-raise
    "RET",     # flake8-return
    "SLF",     # flake8-self
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports
    "ARG",     # flake8-unused-arguments
    "PTH",     # flake8-use-pathlib
    "ERA",     # eradicate (commented-out code)
    "PGH",     # pygrep-hooks
    "PL",      # pylint
    "TRY",     # tryceratops
    "FLY",     # flynt
    "PERF",    # perflint
    "FURB",    # refurb
    "LOG",     # flake8-logging
    "G",       # flake8-logging-format
    "RUF",     # ruff
]
ignore = [
    # subprocess runs git with a fixed argument list, never a shell string.
    "S603",
    "S607",
    # The exception names are the project's vocabulary (NotFound, AccessDenied, InvalidRequest).
    "N818",
    # Refusal messages are fixed texts written where they are raised; the disclosure tests
    # compare them, and a subclass per message would only move them away from the check.
    "TRY003",
]

[tool.ruff.lint.mccabe]
# The cyclomatic counterpart of the cognitive-complexity gate (`mise run complexity`).
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# assert is how pytest asserts; the fixtures' fake secrets are not secrets; an
# expected value written into the assertion is clearer than a named constant.
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
